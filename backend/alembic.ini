# A generic, single database configuration.

[alembic]
# path to migration scripts.
# Use forward slashes (/) also on Windows to ensure compatibility.
script_location = alembic

# Alembic will read the actual database URL from env.py at runtime
# (which pulls it from app.config.settings). This placeholder is overridden.
sqlalchemy.url = sqlite:///./fireflies.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
