services:
  - type: web
    name: meeting-intelligence-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: export PYTHONPATH=. && alembic upgrade head && python app/db/seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        value: sqlite:////tmp/fireflies.db
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: LLM_API_KEY
        value: ""
